[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediahub"
version = "0.1.0"
description = "Автономный локальный медиа-хаб и конвертер: изображения, PDF, видео и аудио"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "Pillow>=10.3",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "qrcode>=7.4",
]

[project.optional-dependencies]
heif = ["pillow-heif>=0.16"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mediahub = "mediahub.cli:main"

[tool.setuptools]
packages = ["mediahub", "mediahub.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
